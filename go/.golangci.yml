run:
  timeout: 3m
linters:
  enable:
    - gofmt
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - gosimple
    - revive
linters-settings:
  staticcheck:
    # Тексты ошибок команд начинаются с заглавной буквы - так задан формат вывода консольной программы
    checks: ["all", "-ST1005"]
issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
